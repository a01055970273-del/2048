<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24123f">
<title>고양이 2048</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#24123f;--bg2:#33195c;--board:#4a2d7f;--cell:#5b3a99;--ink:#f3ebff;--muted:#c7b4e9;--accent:#ffd36e;--w:min(92vw,440px);--gap:calc(var(--w)*.03);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;min-height:100dvh;padding:max(24px,env(safe-area-inset-top)) 0 max(32px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:18px;background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg));color:var(--ink);font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;touch-action:manipulation}
header,.bar,footer{width:var(--w)}header,.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{margin:0;font-size:calc(var(--w)*.105);font-weight:400;white-space:nowrap}.scores{display:flex;gap:7px}.box{min-width:70px;padding:6px 10px;border-radius:12px;background:var(--board);text-align:center}.box small{display:block;color:var(--muted);font-size:12px}.box b{font-size:19px;font-weight:400}
.bar p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
button{border:0;border-radius:13px;padding:10px 15px;background:var(--accent);color:#3b1f6b;font:inherit;font-size:16px;white-space:nowrap;cursor:pointer}button:hover{filter:brightness(1.08)}button:focus-visible{outline:3px solid white;outline-offset:2px}button.ghost{background:transparent;color:var(--ink);border:2px solid var(--muted)}
.board{position:relative;width:var(--w);aspect-ratio:1;padding:var(--gap);border-radius:22px;background:var(--board);touch-action:none;user-select:none;-webkit-user-select:none}.cells,.tiles{position:absolute;inset:var(--gap)}.cells{display:grid;grid-template:repeat(4,1fr)/repeat(4,1fr);gap:var(--gap)}.cells div{display:grid;place-items:center;border-radius:16%;background:var(--cell);font-size:calc(var(--w)*.08)}.cells div:after{content:"🐾";opacity:.12}
.tile{--s:calc((100% - 3*var(--gap))/4);position:absolute;width:var(--s);height:var(--s);left:calc(var(--c)*(var(--s) + var(--gap)));top:calc(var(--r)*(var(--s) + var(--gap)));display:flex;align-items:center;justify-content:center;padding-top:15%;border-radius:16%;font-size:calc(var(--w)*.085);color:#3b1f6b;transition:left .11s ease-out,top .11s ease-out}
.tile:before,.tile:after{content:"";position:absolute;top:-9%;width:30%;height:30%;background:inherit;clip-path:polygon(0 100%,50% 0,100% 100%)}.tile:before{left:9%;transform:rotate(-8deg)}.tile:after{right:9%;transform:rotate(8deg)}.eyes{position:absolute;top:22%;left:50%;width:46%;height:9%;transform:translateX(-50%);display:flex;justify-content:space-between;opacity:.8}.eyes:before,.eyes:after{content:"";width:22%;height:100%;background:currentColor;border-radius:50%}.tile span{position:relative;z-index:1;line-height:1}.spawn{animation:spawn .18s ease-out .1s backwards}.pop{animation:pop .16s ease-out}@keyframes spawn{from{transform:scale(.3);opacity:0}}@keyframes pop{50%{transform:scale(1.14)}}
.v2{background:#efe6ff}.v4{background:#dcc9ff}.v8{background:#c3a2ff}.v16{background:#a97cf5;color:white}.v32{background:#9160e8;color:white}.v64{background:#7a45d6;color:white}.v128{background:#c05bd8;color:white;font-size:calc(var(--w)*.075)}.v256{background:#a63cc7;color:white;font-size:calc(var(--w)*.075)}.v512{background:#8a2aa8;color:white;font-size:calc(var(--w)*.075)}.v1024{background:#e04fa0;color:white;font-size:calc(var(--w)*.062)}.v2048{background:#ffd36e;color:#4a2300;font-size:calc(var(--w)*.062);box-shadow:0 0 28px 6px #ffd36e88}.vbig{background:#1b0c33;color:var(--accent);font-size:calc(var(--w)*.052)}
.overlay{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:13px;border-radius:22px;background:#24123fdb;text-align:center;backdrop-filter:blur(2px)}.overlay.show{display:flex}.overlay .big{font-size:calc(var(--w)*.2);line-height:1}.overlay h2{margin:0;font-size:calc(var(--w)*.08);font-weight:400}.overlay p{margin:0;color:var(--muted)}.overlay .row{display:flex;gap:9px}footer{color:var(--muted);font-size:13px;text-align:center}
@media(max-width:360px){.box{min-width:58px;padding:5px 7px}.bar p{font-size:12px}button{padding:9px 11px}}
@media(prefers-reduced-motion:reduce){.tile{transition:none}.spawn,.pop{animation:none}}
</style>
</head>
<body>
<header><h1>🐱 고양이 2048</h1><div class="scores"><div class="box"><small>점수</small><b id="score">0</b></div><div class="box"><small>최고</small><b id="best">0</b></div></div></header>
<div class="bar"><p>같은 숫자의 고양이를 합쳐<br>2048 고양이를 만나보세요!</p><button id="new">새 게임</button></div>
<main class="board" id="board" role="application" aria-label="2048 게임판"><div class="cells" aria-hidden="true"></div><div class="tiles" id="tiles"></div><div class="overlay" id="overlay" role="dialog" aria-live="polite"><div class="big" id="ovEmoji"></div><h2 id="ovTitle"></h2><p id="ovText"></p><div class="row"><button id="ovKeep" class="ghost" hidden>계속하기</button><button id="ovNew">새 게임</button></div></div></main>
<footer>방향키 또는 WASD · 화면을 스와이프해 이동하세요</footer>
<script>
(()=>{const N=4,tilesEl=document.getElementById("tiles"),scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),overlay=document.getElementById("overlay"),cellsEl=document.querySelector(".cells");for(let i=0;i<N*N;i++)cellsEl.append(document.createElement("div"));
let tiles=[],nextId=1,score=0,best=0,won=false,keepGoing=false,over=false,busy=false;const els=new Map();try{best=+localStorage.getItem("cat2048-best")||0}catch{}
const pos=(d,i,j)=>[[i,j],[j,i],[i,N-1-j],[N-1-j,i]][d];
function spawn(){const taken=new Set(tiles.map(t=>t.r*N+t.c)),free=[];for(let k=0;k<N*N;k++)if(!taken.has(k))free.push(k);if(!free.length)return;const k=free[Math.floor(Math.random()*free.length)];tiles.push({id:nextId++,value:Math.random()<.9?2:4,r:Math.floor(k/N),c:k%N,isNew:true})}
function render(){const live=new Set(tiles.map(t=>t.id));for(const[id,el]of els)if(!live.has(id)){el.remove();els.delete(id)}for(const t of tiles){let el=els.get(t.id);if(!el){el=document.createElement("div");el.innerHTML='<i class="eyes"></i><span></span>';tilesEl.append(el);els.set(t.id,el)}el.className="tile v"+(t.value>2048?"big":t.value)+(t.isNew?" spawn":"")+(t.merged?" pop":"");el.style.setProperty("--r",t.r);el.style.setProperty("--c",t.c);el.lastChild.textContent=t.value;t.isNew=false;t.merged=false}scoreEl.textContent=score;bestEl.textContent=best}
function move(d){if(busy||over)return;const grid=Array.from({length:N},()=>Array(N).fill(null));tiles.forEach(t=>grid[t.r][t.c]=t);let moved=false;
for(let i=0;i<N;i++){let slot=0,prev=null,prevMerged=false;for(let j=0;j<N;j++){const[r,c]=pos(d,i,j),t=grid[r][c];if(!t)continue;if(prev&&!prevMerged&&prev.value===t.value){const[pr,pc]=pos(d,i,slot-1);t.r=pr;t.c=pc;t.dead=true;prev.value*=2;prev.merged=true;prevMerged=true;score+=prev.value;moved=true;if(prev.value===2048&&!won)won=true}else{const[nr,nc]=pos(d,i,slot);if(nr!==t.r||nc!==t.c)moved=true;t.r=nr;t.c=nc;prev=t;prevMerged=false;slot++}}}
if(!moved)return;if(score>best){best=score;try{localStorage.setItem("cat2048-best",best)}catch{}}busy=true;render();setTimeout(()=>{tiles=tiles.filter(t=>!t.dead);spawn();render();busy=false;if(won&&!keepGoing)showOverlay("win");else if(!canMove()){over=true;showOverlay("lose")}},115)}
function canMove(){if(tiles.length<N*N)return true;const g=Array.from({length:N},()=>Array(N).fill(0));tiles.forEach(t=>g[t.r][t.c]=t.value);for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(c<N-1&&g[r][c]===g[r][c+1]||r<N-1&&g[r][c]===g[r+1][c])return true;return false}
function showOverlay(kind){const win=kind==="win";document.getElementById("ovEmoji").textContent=win?"😺":"😿";document.getElementById("ovTitle").textContent=win?"2048 고양이 완성!":"더 움직일 수 없어요";document.getElementById("ovText").textContent=win?"축하해요! 계속 플레이할 수도 있어요.":"최종 점수 "+score+"점";document.getElementById("ovKeep").hidden=!win;overlay.classList.add("show")}
function newGame(){tiles=[];score=0;won=false;keepGoing=false;over=false;busy=false;overlay.classList.remove("show");spawn();spawn();render()}
document.getElementById("new").onclick=newGame;document.getElementById("ovNew").onclick=newGame;document.getElementById("ovKeep").onclick=()=>{keepGoing=true;overlay.classList.remove("show")};
const keys={ArrowLeft:0,ArrowUp:1,ArrowRight:2,ArrowDown:3,a:0,w:1,d:2,s:3,A:0,W:1,D:2,S:3};addEventListener("keydown",e=>{if(e.key in keys&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();move(keys[e.key])}});
const board=document.getElementById("board");let sx=0,sy=0,tracking=false;board.addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;tracking=true},{passive:true});board.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});board.addEventListener("touchend",e=>{if(!tracking)return;tracking=false;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?2:0:dy>0?3:1)});
newGame()})();
</script>
</body></html>
